# 맥용 설치 파일 빌드
# 릴리스가 올라가면(npm run release) 맥 서버에서 .dmg 를 만들어 같은 릴리스에 붙인다.
# 이미 있는 릴리스에 다시 붙이려면: Actions → "macOS build" → Run workflow → 태그 입력
name: macOS build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '맥 빌드를 붙일 릴리스 태그 (예: v1.4.0)'
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build dmg (Apple Silicon + Intel)
        run: npx electron-builder --mac --publish never

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release
          gh release upload "$TAG" release/*.dmg release/*.zip release/latest-mac.yml --clobber
